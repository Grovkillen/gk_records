  # the functions (GkRecords::Features) and the tabs, human test records_1021
  field_gk_records_tab_counts: "Number on the tabs"
  text_gk_records_tab_counts: "The tabs on an issue show the number, for example Links (3) and Assessments (1). Holds for the whole installation."
  label_gk_records_features: "Functions"
  text_gk_records_features: "What records offers other plugins. A function that is off does not show: its page, menu row and tab are hidden, but nothing is removed, and it all shows again when it is turned on. A plugin that needs a function turns it on itself. Reasons are set under Administration, Reasons and are off from the start."
  label_gk_records_feature_links: "Links"
  text_gk_records_feature_links: "Links between things: the Links tab on issues and the page with all of a thing's links, where links by hand are added and voided."
  label_gk_records_feature_assessments: "Assessments"
  text_gk_records_feature_assessments: "The Assessments tab on issues that have been assessed, and the page with all of a thing's assessments. Assessments are made by rules in other plugins, not here."
  label_gk_records_feature_events: "Events"
  text_gk_records_feature_events: "The Events page under Administration: the whole log of who did what and when. Events are always written, also while the page is hidden."
  label_gk_records_feature_readings: "Readings"
  text_gk_records_feature_readings: "The Readings page under Administration: every import and sync, with source, files and what it changed."
  label_gk_records_feature_verification: "Verification status"
  text_gk_records_feature_on_by: "Turned on by %{plugins}."
  text_gk_records_feature_unused: "Used by %{plugins}, which are not installed. With records alone it gives little."
  text_gk_records_verification_on_trackers: "On for %{trackers}."
  text_gk_records_verification_off: "Off: no tracker has it."
  text_gk_records_feature_verification: "A row on issues of chosen trackers where a person says how well the issue's content is supported: Hypothesis, Unverified or Partly verified, set by hand with a reason. The row is about the whole issue, not single fields. It helps where an issue carries a claim someone is to judge, for example the cause of a fault, a risk or a figure from a supplier: the judgement becomes searchable, and the issue list's column and filter later give reports on what is supported and what is only assumed. Without such a use the row says little; it is powerful where you know what you want it for. Turned on for a tracker on the tracker's own page."
  text_gk_records_feature_verification_review: "A row on issues of chosen trackers where people say how well the issue's content is supported: Hypothesis, Unverified or Partly verified, set by hand with a reason, or Verified, which is reached only when one or more people have approved a review. The row is about the whole issue, not single fields. It helps where an issue carries a claim someone is to judge, for example the cause of a fault, a risk or a figure from a supplier: the judgement becomes searchable, and the issue list's column and filter later give reports on what is supported and what is only assumed. Turned on for a tracker on the tracker's own page."
  # Read in documents
