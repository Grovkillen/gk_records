  field_gk_records_mark_restricted_people: "Mark people not everyone may see"
  text_gk_records_mark_restricted_people: "Only the mark is turned on or off here. Who may see whom is decided in core, by the roles' %{setting} under %{roles}: a role with %{members} sees only members of the projects it sees itself, so a person with no project in common is hidden from it. The mark is a small icon after the name of a person or group you may see but someone who sees the same thing (the issue, the link, the event) may not; they see \"a person you may not see\" instead of the name. The number shows on hover, never who. Where the name stands on no thing, every user in the installation counts. Holds for every part that shows people through records."
