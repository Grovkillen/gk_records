  text_gk_records_verification_help_review: "Hur väl innehållet är belagt: Hypotes (ett antagande), Ej verifierad (ingen har kontrollerat det), Delvis verifierad (något stöder det) eller Verifierad. Verifierad nås bara genom ett godkänt granskningsprov; de andra sätts för hand, med skäl."
