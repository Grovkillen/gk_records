  # the functions (GkRecords::Features) and the tabs, human test records_1021
  field_gk_records_tab_counts: "Antal i flikarna"
  text_gk_records_tab_counts: "Flikarna på ett ärende visar antalet, till exempel Kopplingar (3) och Bedömningar (1). Gäller hela installationen."
  label_gk_records_features: "Funktioner"
  text_gk_records_features: "Det records erbjuder andra plugin. En funktion som är av syns inte: sidan, menyraden och fliken döljs, men inget tas bort, och allt syns igen när den slås på. Ett plugin som behöver en funktion slår på den själv. Skäl styrs under Administration, Skäl och är av från början."
  label_gk_records_feature_links: "Kopplingar"
  text_gk_records_feature_links: "Kopplingar mellan saker: fliken Kopplingar på ärenden och sidan med alla kopplingar för en sak, där kopplingar för hand läggs till och makuleras."
  label_gk_records_feature_assessments: "Bedömningar"
  text_gk_records_feature_assessments: "Fliken Bedömningar på ärenden som har bedömts, och sidan med en saks alla bedömningar. Bedömningar görs av regler i andra plugin, inte här."
  label_gk_records_feature_events: "Händelser"
  text_gk_records_feature_events: "Sidan Händelser under Administration: hela loggen över vem som gjorde vad och när. Händelserna skrivs alltid, också när sidan är dold."
  label_gk_records_feature_readings: "Inläsningar"
  text_gk_records_feature_readings: "Sidan Inläsningar under Administration: varje import och synk, med källa, filer och vad den ändrade."
  label_gk_records_feature_verification: "Verifieringsstatus"
  text_gk_records_feature_on_by: "Slås på av %{plugins}."
  text_gk_records_feature_unused: "Används av %{plugins}, som inte är installerade. Med bara records ger den lite."
  text_gk_records_verification_on_trackers: "På för %{trackers}."
  text_gk_records_verification_off: "Av: ingen ärendetyp har den."
  text_gk_records_feature_verification: "En rad på ärenden av valda ärendetyper där en människa anger hur väl ärendets innehåll är belagt: Hypotes, Ej verifierad eller Delvis verifierad, satt för hand med skäl. Raden gäller hela ärendet, inte enskilda fält. Den gör nytta där ett ärende bär ett påstående som någon ska bedöma, till exempel orsaken till ett fel, en risk eller en uppgift från en leverantör: bedömningen blir sökbar, och ärendelistans kolumn och filter ger senare rapporter över vad som är belagt och vad som bara är antaget. Utan en sådan användning säger raden lite; den är kraftfull där man vet vad man vill ha den till. Slås på för en ärendetyp på ärendetypens sida."
  text_gk_records_feature_verification_review: "En rad på ärenden av valda ärendetyper där människor anger hur väl ärendets innehåll är belagt: Hypotes, Ej verifierad eller Delvis verifierad, satt för hand med skäl, eller Verifierad, som bara nås när en eller flera personer har godkänt en granskning. Raden gäller hela ärendet, inte enskilda fält. Den gör nytta där ett ärende bär ett påstående som någon ska bedöma, till exempel orsaken till ett fel, en risk eller en uppgift från en leverantör: bedömningen blir sökbar, och ärendelistans kolumn och filter ger senare rapporter över vad som är belagt och vad som bara är antaget. Slås på för en ärendetyp på ärendetypens sida."
  # Läs in dokument
  label_gk_records_docimp: "Läs in dokument"
  text_gk_records_docimp_intro: "Läs in dokument ur en zip med en dokumentlista (CSV) och filerna. Varje rad blir ett dokument i projektet eller i underprojektet raden anger, med filen som bilaga. Hela listan blir en inläsning som behåller zippens namn, storlek och SHA-256 men inte zippen, och varje dokument visar varifrån det kom. Förhandsvisningen visar vad som händer innan något sparas."
